<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tilin.gato | Instagram</title>
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body class="instagram-page">
    <div class="insta-topbar">
      <div class="insta-topbar_inner">
        <span class="insta-topbar_logo">Instagram</span>
        <div class="insta-topbar_actions">
          <button class="insta-topbar_icon" type="button" aria-label="Inicio">
            <svg
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
          </button>
          <button
            class="insta-topbar_icon"
            type="button"
            aria-label="Notificaciones"
          >
            <svg
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
              />
            </svg>
          </button>
          <button class="insta-topbar_icon" type="button" aria-label="Mensajes">
            <svg
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <main class="main">
      <section class="profile">
        <div class="profile_container">
          <div class="profile_avatar_ring">
            <img
              src="./images/pp_cat.jpg"
              alt="Foto de perfil de tilin.gato"
              class="profile_avatar"
            />
          </div>
          <div class="profile_info">
            <div class="profile_top">
              <h2 class="profile_username">
                tilin.gato
                <svg
                  class="profile_verified"
                  viewBox="0 0 24 24"
                  width="16"
                  height="16"
                  aria-hidden="true"
                >
                  <path
                    fill="currentColor"
                    d="M12 2 14.5 4.5 18 4l0.5 3.5L22 9l-1.5 3 1.5 3-3.5 1.5L18 20l-3.5-.5L12 22l-2.5-2.5L6 20l-.5-3.5L2 15l1.5-3L2 9l3.5-1.5L6 4l3.5.5L12 2Z"
                  />
                  <path
                    fill="var(--color-bg)"
                    d="m9.5 12.5 2 2 4-4.5"
                    stroke="var(--color-bg)"
                    stroke-width="1.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    fill="none"
                  />
                </svg>
              </h2>
              <div class="profile_actions">
                <button class="profile_edit_button">Editar perfil</button>
                <button class="profile_archive_button" type="button">
                  Ver archivo
                </button>
                <button
                  class="profile_settings_button"
                  aria-label="Configuración"
                  type="button"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="3" />
                    <path
                      d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15 1.65 1.65 0 0 0 3.09 14H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.32.22.66.24 1H21a2 2 0 0 1 0 4h-.09c-.02.34-.1.68-.24 1z"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <ul class="profile_stats">
              <li>
                <strong class="profile_stats_posts">0</strong> publicaciones
              </li>
              <li>
                <strong class="profile_stats_followers">248</strong> seguidores
              </li>
              <li>
                <strong class="profile_stats_following">180</strong> seguidos
              </li>
            </ul>
            <p class="profile_bio">
              🐱 Gato atigrado naranja &middot; 3 años<br />
              Amante de las siestas y el atún 🐟
            </p>
          </div>
        </div>

        <div class="profile_highlights_wrapper">
          <button
            class="highlights_nav highlights_nav--prev"
            type="button"
            aria-label="Ver destacados anteriores"
            hidden
          >
            <svg
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>

          <div class="profile_highlights" id="profile-highlights">
            <div class="highlight_item highlight_item--new">
              <div class="highlight_circle highlight_circle--new">+</div>
              <span class="highlight_label">Nuevo</span>
            </div>
            <div class="highlight_item">
              <div class="highlight_circle">
                <img src="./images/pp_cat.jpg" alt="Destacado: Siestas" />
              </div>
              <span class="highlight_label">Siestas</span>
            </div>
            <div class="highlight_item">
              <div class="highlight_circle">
                <img src="./images/consultageneral.jpg" alt="Destacado: Vet" />
              </div>
              <span class="highlight_label">Vet</span>
            </div>
            <div class="highlight_item">
              <div class="highlight_circle">
                <img src="./images/bañomascota.jpg" alt="Destacado: Spa" />
              </div>
              <span class="highlight_label">Spa</span>
            </div>
          </div>

          <button
            class="highlights_nav highlights_nav--next"
            type="button"
            aria-label="Ver más destacados"
          >
            <svg
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </div>

        <!-- Popup 1: editar perfil -->
        <div class="popup" id="popup-edit">
          <div class="popup_container">
            <div class="popup_tittle">Editar perfil</div>
            <button class="popup_close">X</button>
            <div class="popup_content">
              <form action="#" class="form" id="edit-profile-form">
                <label for="edit-username">Nombre de usuario</label>
                <input
                  type="text"
                  class="form_name"
                  name="username"
                  id="edit-username"
                />
                <label for="edit-bio">Biografía</label>
                <input
                  type="text"
                  class="form_description"
                  name="bio"
                  id="edit-bio"
                />
                <button type="submit" class="form_button">
                  Guardar cambios
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Popup 2: configuración -->
        <div class="popup-agenda" id="popup-settings">
          <div class="popup-agenda_container">
            <div class="popup-agenda_title">Configuración</div>
            <button class="popup-agenda_close">X</button>
            <div class="popup-agenda_content">
              <form action="#" class="form form-settings" id="settings-form">
                <label class="settings_option">
                  <span>Cuenta privada</span>
                  <input
                    type="checkbox"
                    class="settings_input"
                    name="cuenta-privada"
                    value="Cuenta privada"
                  />
                </label>
                <label class="settings_option">
                  <span>Notificaciones activas</span>
                  <input
                    type="checkbox"
                    class="settings_input"
                    name="notificaciones"
                    value="Notificaciones activas"
                    checked
                  />
                </label>
                <label class="settings_option">
                  <span>Tema claro</span>
                  <input
                    type="checkbox"
                    class="settings_input"
                    id="settings-theme"
                    name="tema-claro"
                    value="Tema claro"
                  />
                </label>
                <label class="settings_option">
                  <span>Mostrar estado de actividad</span>
                  <input
                    type="checkbox"
                    class="settings_input"
                    name="mostrar-actividad"
                    value="Mostrar actividad"
                    checked
                  />
                </label>
                <button type="submit" class="form_button">
                  Guardar preferencias
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Popup 3: confirmación -->
        <div class="popup" id="popup-confirm">
          <div class="popup_container">
            <div class="popup_tittle">¡Listo!</div>
            <button class="popup_close">X</button>
            <div class="popup_content">
              <p class="popup-confirm_message"></p>
              <button class="form_button popup-confirm_accept">Aceptar</button>
            </div>
          </div>
        </div>
      </section>

      <section class="cards">
        <div class="profile_tabs">
          <button
            class="profile_tab profile_tab--active"
            type="button"
            aria-label="Publicaciones"
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <line x1="3" y1="9" x2="21" y2="9" />
              <line x1="3" y1="15" x2="21" y2="15" />
              <line x1="9" y1="3" x2="9" y2="21" />
              <line x1="15" y1="3" x2="15" y2="21" />
            </svg>
            <span class="sr-only">Publicaciones</span>
          </button>
          <button class="profile_tab" type="button" aria-label="Guardado">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" />
            </svg>
            <span class="sr-only">Guardado</span>
          </button>
          <button class="profile_tab" type="button" aria-label="Etiquetas">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20.59 13.41 13.42 20.59a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
              />
              <line x1="7" y1="7" x2="7.01" y2="7" />
            </svg>
            <span class="sr-only">Etiquetas</span>
          </button>
        </div>
        <div class="card_container"></div>
      </section>
    </main>

    <footer class="insta-footer">
      <p class="insta-footer_text">&copy; 2026 tilin.gato</p>
    </footer>

    <template id="card-template">
      <div class="card">
        <img class="card_image" src="" alt="" />
        <div class="card_overlay">
          <span class="card_overlay_item">
            <svg
              class="card_overlay_icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="#ffffff"
            >
              <path
                d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              />
            </svg>
            <span class="card_overlay_likes"></span>
          </span>
          <span class="card_overlay_item">
            <svg
              class="card_overlay_icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="#ffffff"
            >
              <path
                d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
              />
            </svg>
            <span class="card_overlay_comments"></span>
          </span>
        </div>
        <div class="card_heart">
          <svg viewBox="0 0 24 24" width="72" height="72" fill="#ffffff">
            <path
              d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            />
          </svg>
        </div>
        <button class="card_like_button" type="button" aria-label="Me gusta">
          <svg
            class="card_like_icon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
          >
            <path
              d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            />
          </svg>
        </button>
      </div>
    </template>
    <script type="module" src="./scripts/script.js"></script>
  </body>
</html>
